<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Store · Προσωπικό</title>
<meta name="theme-color" content="#1d4a2c">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm shop-floor tool, quick to scan
   IDEA: the order spike at the counter — tickets you clear one by one
   PICTURE: big order codes on ticket cards, colour = status
   COLOUR and TYPE: same pasture green / milk / yolk as the app; Commissioner
   LAYOUT: sticky top bar with tabs, ticket grid (1 column on phones) */
:root{color-scheme:light dark;--bg:light-dark(#f4f1e8,#101a13);--card:light-dark(#fff,#18261c);--ink:light-dark(#18231b,#eef2ea);
 --muted:light-dark(#5d6b60,#a3b2a6);--line:light-dark(#e4e0d3,#26382b);--green:#1d4a2c;--green2:light-dark(#2f6b40,#5fa06f);--yolk:#f3b52f;--yolk-ink:#2a1f00;--red:#c0392b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Commissioner,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--green);color:#f4f1e8;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:12px;max-width:1300px;margin:0 auto;flex-wrap:wrap}
.bar h1{font-size:20px;margin:0;font-weight:800;flex:1}
.bar small{opacity:.8;font-size:13px}
.out{border:1.5px solid rgba(244,241,232,.5);background:transparent;color:#f4f1e8;border-radius:999px;padding:6px 14px;min-height:40px;font-weight:600;font-size:14px}
.tabs{display:flex;gap:6px;max-width:1300px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:#cfe0d2;font-weight:600;padding:10px 14px;border-radius:12px 12px 0 0;min-height:44px}
.tab.on{background:var(--bg);color:var(--ink)}
.tab b{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px}
.tab.on b{background:var(--yolk);color:var(--yolk-ink)}
main{max-width:1300px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools input[type=search]{flex:1 1 220px;font-size:16px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:46px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:44px;white-space:nowrap}
.chk input{width:20px;height:20px;accent-color:var(--green2)}
@media(max-width:600px){.bar h1{font-size:17px}.bar h1 span{display:none}.bar small{display:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.t{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;position:relative}
.t.new{border-color:var(--green2)}
.t.fresh::before{content:"ΝΕΑ";position:absolute;top:-10px;left:14px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}
.t.issue{border-color:var(--yolk)}
.t.done{opacity:.75}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.code{font-size:30px;font-weight:800;letter-spacing:.06em;line-height:1}
.st{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:light-dark(#e8ece6,#2a3a2e)}
.st.ready{background:#2f6b40;color:#fff}.st.issue{background:var(--yolk);color:var(--yolk-ink)}.st.done{background:transparent;color:var(--muted);border:1px solid var(--line)}
.who{margin:8px 0 2px;font-weight:600;font-size:17px}
.meta{color:var(--muted);font-size:14px;display:flex;gap:4px 12px;flex-wrap:wrap}
.meta a{color:var(--green2);font-weight:600;white-space:nowrap}
.pick{display:inline-block;margin-top:8px;background:var(--yolk);color:var(--yolk-ink);font-weight:700;font-size:14px;border-radius:8px;padding:3px 10px}
.items{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--line)}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.items b{font-size:18px;white-space:nowrap}
.cnote{background:light-dark(#f1efe7,#223427);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 10px}
textarea{width:100%;font-size:15px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 12px;min-height:44px;resize:vertical}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts button{border:0;border-radius:12px;min-height:48px;font-weight:700;font-size:15px}
.b-ready{background:#2f6b40;color:#fff}.b-issue{background:var(--yolk);color:var(--yolk-ink)}
.b-done{grid-column:1/-1;background:transparent;border:1.5px solid var(--line)!important;color:var(--ink)}
.b-back{grid-column:1/-1;background:transparent;color:var(--muted);text-decoration:underline}
.acts button:disabled{opacity:.5}
.err{color:var(--red);font-size:14px;min-height:1em;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.login{max-width:420px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.login h2{margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 16px}
.login input{width:100%;font-size:16px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;min-height:48px;margin-bottom:10px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;min-height:52px;font-weight:600;margin-bottom:14px}
.gbtn svg{width:20px;height:20px}
.main{width:100%;border:0;border-radius:14px;background:var(--yolk);color:var(--yolk-ink);font-weight:800;min-height:52px}
.link{border:0;background:none;color:var(--green2);font-weight:600;text-decoration:underline;padding:10px 0;min-height:44px}
.day{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:14px 0 0;font-size:20px;font-weight:800;border-bottom:2px solid var(--line);padding-bottom:6px}
.day:first-child{margin-top:0}
.day span{font-size:14px;font-weight:600;color:var(--muted)}
#day{font-size:15px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:44px;color:var(--ink)}
.pw{position:relative;display:block}
.pw input{padding-right:52px!important}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:10px;padding:0}
.eye svg{width:22px;height:22px}
.eye:hover{color:var(--ink)}
.st.cancelled{background:transparent;color:var(--red);border:1px solid var(--red)}
.t.cancelled{opacity:.8;border-style:dashed}
.cby{margin:6px 0 0;color:var(--red);font-weight:700;font-size:14px}
.b-cancel{grid-column:1/-1;background:transparent;color:var(--red);font-weight:600!important;text-decoration:underline;min-height:40px!important}
.b-cancel.arm{background:var(--red);color:#fff;text-decoration:none}
.toasts{position:fixed;right:16px;bottom:16px;z-index:20;display:grid;gap:8px;max-width:min(420px,calc(100% - 32px))}
.toast{background:var(--red);color:#fff;font-weight:700;padding:14px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer}
.thr{display:flex;align-items:center;gap:8px;flex-direction:row-reverse}
.b-print{flex:none;width:44px;height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;color:var(--ink);display:grid;place-items:center;padding:0}
.b-print svg{width:22px;height:22px}
.b-print:hover{border-color:var(--green2);color:var(--green2)}
.th{align-items:center!important}
#paper{font-size:15px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:44px;color:var(--ink)}
#printArea{display:none}
@media print{
 body>*:not(main),main>*:not(#printArea){display:none!important}
 main{padding:0!important;margin:0!important;max-width:none!important}
 body{background:#fff!important;color:#000!important}
 #printArea{display:block!important}
 .rc{width:var(--pw,72mm);font:12pt/1.3 "Arial","Helvetica",sans-serif;color:#000;padding:0 1mm}
 .rc .shop{text-align:center;font-weight:800;font-size:13pt;border-bottom:2px dashed #000;padding-bottom:2mm;margin-bottom:2mm}
 .rc .code{text-align:center;font-size:30pt;font-weight:900;letter-spacing:2px;margin:1mm 0}
 .rc .pk{text-align:center;font-weight:900;border:2px solid #000;padding:1mm;margin:1mm 0 2mm;font-size:12pt}
 .rc .row{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:2mm}
 .rc .row span:last-child{margin-left:auto;text-align:right}
 .rc table{width:100%;border-collapse:collapse;margin:2mm 0;border-top:2px solid #000;border-bottom:2px solid #000}
 .rc td{padding:1.2mm 0;vertical-align:top;border-bottom:1px dotted #000;font-size:12pt}
 .rc td.q{text-align:right;font-weight:900;font-size:15pt;white-space:nowrap;padding-left:2mm}
 .rc .box{border:1px solid #000;padding:1.5mm;margin:1.5mm 0;font-size:11pt}
 .rc .foot{margin-top:4mm;font-size:10pt}
 .rc .cut{height:12mm}
}
.tsum{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0;margin-top:4px;color:inherit;cursor:pointer}
.tsum .who{display:block}
.sline{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.chev{margin-left:auto;font-size:18px;color:var(--ink);transition:transform .15s}
.t.open .chev{transform:rotate(180deg)}
.tb{margin-top:6px}
.exp{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 14px;font-weight:600;color:var(--ink)}
[hidden]{display:none!important}
.shelp{color:var(--muted);font-size:14px;margin:0 0 6px}
#stockList .day{margin-top:18px}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.srow.is-out{border-color:var(--red);background:light-dark(#fff5f4,#2a1b1a)}
.sth{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden;flex:none}
.sth img{width:100%;height:100%;object-fit:cover}
.sname{flex:1 1 200px;font-weight:600}
.seg3{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:0 1 auto}
.seg3 button{border:0;background:transparent;padding:0 12px;min-height:42px;font-weight:600;font-size:14px;color:var(--ink);border-left:1px solid var(--line)}
.seg3 button:first-child{border-left:0}
.seg3 button.on{background:#2f6b40;color:#fff}
.srow.is-out .seg3 button.on{background:var(--red);color:#fff}
@media(max-width:600px){.seg3{width:100%}.seg3 button{flex:1;padding:0 6px;font-size:13px}}
.demo{background:var(--yolk);color:var(--yolk-ink);font-size:13px;text-align:center;padding:6px 12px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.t.fresh{animation:pulse 1.6s ease-in-out 3}@keyframes pulse{50%{box-shadow:0 0 0 6px light-dark(#dcefe0,#1f3a27)}}}
</style>
</head>
<body>
<div class="demo" id="demoBar" hidden>Δοκιμαστική λειτουργία: τα δεδομένα μένουν μόνο σε αυτή τη συσκευή</div>
<header class="top">
 <div class="bar"><h1>Campus Store<span> · Παραγγελίες</span></h1><small id="who"></small><button class="out" id="outBtn" hidden>Αποσύνδεση</button></div>
 <nav class="tabs" id="tabs" hidden>
  <button class="tab on" data-t="active">Προς ετοιμασία<b id="n-active">0</b></button>
  <button class="tab" data-t="ready">Έτοιμες<b id="n-ready">0</b></button>
  <button class="tab" data-t="done" title="Ο αριθμός δείχνει τις σημερινές παραλαβές">Παραλήφθηκαν<b id="n-done">0</b></button>
  <button class="tab" data-t="cancelled" title="Ο αριθμός δείχνει τις σημερινές ακυρώσεις">Ακυρωμένες<b id="n-cancelled">0</b></button>
  <button class="tab" data-t="stock" title="Ο αριθμός δείχνει πόσα προϊόντα δεν είναι διαθέσιμα">Διαθεσιμότητα<b id="n-stock">0</b></button>
 </nav>
</header>

<main>
 <section class="login" id="login" hidden>
  <h2>Σύνδεση προσωπικού</h2>
  <p id="loginMsg">Μόνο για το προσωπικό του Campus Store.</p>
  <button class="gbtn" id="googleBtn" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Σύνδεση με Google</button>
  <form id="authForm" novalidate>
   <input type="email" id="aEmail" placeholder="Email καταστήματος" autocomplete="email">
   <input type="password" id="aPass" placeholder="Κωδικός" autocomplete="current-password">
   <button class="main" type="submit" id="authBtn">Σύνδεση</button>
  </form>
  <button class="link" id="modeBtn" type="button">Πρώτη φορά; Δημιουργία κωδικού</button>
  <div class="err" id="aErr"></div>
 </section>

 <div id="toasts" class="toasts" aria-live="assertive"></div>
 <div id="printArea" aria-hidden="true"></div>
 <section id="board" hidden>
  <div class="tools" id="tools">
   <input type="search" id="q" placeholder="Αναζήτηση: κωδικός, όνομα ή τηλέφωνο" autocomplete="off">
   <label class="chk" id="dayBox" hidden>Ημέρα <select id="day"></select></label>
   <button class="exp" id="expAll" type="button">Άνοιγμα όλων</button>
   <label class="chk"><input type="checkbox" id="sound"> Ήχος σε νέα παραγγελία</label>
   <label class="chk">Χαρτί <select id="paper"><option value="80">80 mm</option><option value="58">58 mm</option></select></label>
   <label class="chk" title="Τυπώνει μόνη της κάθε νέα παραγγελία, όσο η σελίδα είναι ανοιχτή"><input type="checkbox" id="autoprint"> Αυτόματη εκτύπωση νέων</label>
  </div>
  <div class="grid" id="grid"></div>
  <div id="stockList" hidden></div>
 </section>
</main>

<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script src="catalog.js"></script>
<script>
{
/* eye button on password fields: tap to show / hide what was typed */
{
 const open='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
 const shut='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.7 8.4 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
 document.querySelectorAll('input[type=password]').forEach(inp=>{
  const w=document.createElement('span');w.className='pw';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement('button');b.type='button';b.className='eye';b.innerHTML=open;b.setAttribute('aria-label','Εμφάνιση κωδικού');b.setAttribute('aria-pressed','false');w.appendChild(b);
  b.addEventListener('click',()=>{const show=inp.type==='password';inp.type=show?'text':'password';b.innerHTML=show?shut:open;
   b.setAttribute('aria-label',show?'Απόκρυψη κωδικού':'Εμφάνιση κωδικού');b.setAttribute('aria-pressed',String(show));inp.focus({preventScroll:true})});
  inp.form&&inp.form.addEventListener('submit',()=>{inp.type='password';b.innerHTML=open}); // hide again after sending
 });
}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=CSBackend.STATUS,msg=e=>CSBackend.msg(e);
let API=null,user=null,orders=[],tab='active',unwatch=null,seen=null,signUp=false;
const drafts={}; // staff notes being typed, kept across live refreshes

function fmtTime(d){const t=d.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
 return new Date().toDateString()===d.toDateString()?'Σήμερα '+t:d.toLocaleDateString('el-GR',{weekday:'short',day:'numeric',month:'short'})+' '+t}
function pick(o){return o.pickup&&o.pickup!=='today'?'Παραλαβή '+new Date(o.pickup+'T12:00').toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'}):''}
function lines(o){if(o.lines&&o.lines.length)return o.lines;return Object.entries(o.items||{}).map(([id,q])=>({n:'Προϊόν '+id,q}))}

const openIds=new Set();let allOpen=false; // which orders are expanded
function ticket(o){
 const st=STATUS[o.status]||STATUS.new,fresh=o.status==='new'&&Date.now()-o.at<10*60e3;
 const open=allOpen||openIds.has(o.id),n=lines(o).reduce((a,l)=>a+(+l.q||0),0);
 const note=drafts[o.id]!==undefined?drafts[o.id]:(o.staffNote||'');
 const tel=String(o.phone||'').replace(/[^\d+]/g,'');
 return `<article class="t ${st.c}${fresh?' fresh':''}${open?' open':''}" data-id="${esc(o.id)}">
  <div class="th"><span class="code">#${esc(o.code||'----')}</span><span class="thr"><button class="b-print" type="button" title="Εκτύπωση παραγγελίας" aria-label="Εκτύπωση παραγγελίας #${esc(o.code||'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/><path d="M17 12h.01"/></svg></button><span class="st ${st.c}">${st.t}${(o.status==='done'||o.status==='cancelled')&&o.upd?' '+esc(o.upd.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'})):''}</span></span></div>
  ${o.status==='cancelled'?`<p class="cby">${o.cancelledBy==='customer'?'Ακυρώθηκε από τον πελάτη':'Ακυρώθηκε από το κατάστημα'}</p>`:''}
  <button class="tsum" type="button" aria-expanded="${open}"><span class="who">${esc(o.name)}</span>
   <span class="sline">${esc(fmtTime(o.at))} · ${n} ${n===1?'τεμάχιο':'τεμάχια'}${o.notes?' · 💬':''}<span class="chev" aria-hidden="true">▾</span></span>
   ${pick(o)?`<span class="pick">${esc(pick(o))}</span>`:''}</button>
  <div class="tb"${open?'':' hidden'}>
  <div class="meta">${o.status==='done'||o.status==='cancelled'?`<span>Παραγγελία ${esc(fmtTime(o.at))}</span>`:''}${tel?`<a href="tel:${esc(tel)}">${esc(o.phone)}</a>`:''}</div>
  <ul class="items">${lines(o).map(l=>`<li><span>${esc(l.n)}</span><b>× ${esc(l.q)}</b></li>`).join('')}</ul>
  ${o.notes?`<p class="cnote"><b>Σχόλιο πελάτη:</b> ${esc(o.notes)}</p>`:''}
  ${o.status==='done'||o.status==='cancelled'?(o.staffNote?`<p class="cnote"><b>Σημείωμα:</b> ${esc(o.staffNote)}</p>`:''):`<textarea class="note" placeholder="Σημείωμα για τον πελάτη (π.χ. τι λείπει)">${esc(note)}</textarea>`}
  <div class="acts">${o.status==='done'
   ?`<button class="b-back" data-s="ready">Επαναφορά στις έτοιμες</button>`
   :o.status==='cancelled'?`<button class="b-back" data-s="new">Επαναφορά (ενεργή ξανά)</button>`
   :`<button class="b-ready" data-s="ready"${o.status==='ready'?' disabled':''}>✓ Έτοιμη</button><button class="b-issue" data-s="issue">⚠ Λείπει κάτι</button><button class="b-done" data-s="done">Παραλήφθηκε</button><button class="b-cancel" data-s="cancelled">Ακύρωση παραγγελίας</button>`}</div>
  <div class="err"></div></div></article>`;
}

const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function dayLabel(k){const d=new Date(k+'T12:00'),t=dayKey(new Date()),y=dayKey(new Date(Date.now()-864e5));
 const long=d.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'});return k===t?'Σήμερα · '+long:k===y?'Χθες · '+long:long[0].toUpperCase()+long.slice(1)}
const doneAt=o=>o.upd||o.at;
const units=l=>l.reduce((a,o)=>a+lines(o).reduce((x,y)=>x+(+y.q||0),0),0);
/* availability (sold out) */
let stock={},unstock=null;
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const outState=id=>{const v=stock[id];if(!v)return '';if(!v.until)return 'off';return v.until>=dk(new Date())?'today':''};
const optName=(it,l)=>['Ποσότητα','Τεμάχια','Τεμάχιο','Φιάλες'].includes(l)||!it.t?(it.t||l):it.t+' — '+l;
function paintStock(){
 $('stockList').innerHTML=`<p class="shelp">Ό,τι σημειώσετε εδώ φαίνεται αμέσως στην εφαρμογή ως μη διαθέσιμο και δεν μπαίνει στο καλάθι. Το «Εξαντλήθηκε σήμερα» γίνεται ξανά διαθέσιμο μόνο του την επόμενη μέρα.</p>`+
 window.CS_CATALOG.map(c=>`<h2 class="day">${esc(c.name)}</h2>`+c.items.map(it=>it.v.map(([id,l,ph])=>{const st=outState(id),p=ph||it.p;
  return `<div class="srow${st?' is-out':''}" data-id="${esc(id)}"><span class="sth">${p?`<img src="${esc(p)}.jpg" alt="" loading="lazy" onerror="this.remove()">`:''}</span>
   <span class="sname">${esc(optName(it,l).replace(/\u00a0/g,' '))}</span>
   <span class="seg3"><button type="button" data-v=""${!st?' class="on"':''}>Διαθέσιμο</button><button type="button" data-v="today"${st==='today'?' class="on"':''}>Εξαντλήθηκε σήμερα</button><button type="button" data-v="off"${st==='off'?' class="on"':''}>Μέχρι νεωτέρας</button></span></div>`}).join('')).join('')).join('');
}
function countOut(){let n=0;window.CS_CATALOG.forEach(c=>c.items.forEach(it=>it.v.forEach(v=>{if(outState(v[0]))n++})));$('n-stock').textContent=n}
function onStock(m){stock=m||{};countOut();if(tab==='stock')paintStock()}
function paint(){
 const isStock=tab==='stock';$('grid').hidden=isStock;$('stockList').hidden=!isStock;$('tools').hidden=isStock;
 if(isStock){paintStock();countOut()}
 const q=$('q').value.trim().toLowerCase().replace(/^#/,'');
 const month=Date.now()-30*864e5,today=dayKey(new Date());
 const groups={active:orders.filter(o=>o.status==='new'||o.status==='issue'),ready:orders.filter(o=>o.status==='ready'),done:orders.filter(o=>o.status==='done'&&doneAt(o)>month),cancelled:orders.filter(o=>o.status==='cancelled'&&doneAt(o)>month)};
 $('n-active').textContent=groups.active.length;$('n-ready').textContent=groups.ready.length;
 $('n-done').textContent=groups.done.filter(o=>dayKey(doneAt(o))===today).length; // picked up today
 $('n-cancelled').textContent=groups.cancelled.filter(o=>dayKey(doneAt(o))===today).length;
 const hist=tab==='done'||tab==='cancelled';
 // day picker for the picked-up tab
 const days={};(hist?groups[tab]:[]).forEach(o=>{const k=dayKey(doneAt(o));days[k]=(days[k]||0)+1});
 const sel=$('day'),cur=sel.value;
 sel.innerHTML=`<option value="">Όλες οι ημέρες (${hist?groups[tab].length:0})</option>`+Object.keys(days).sort().reverse().map(k=>`<option value="${k}">${esc(dayLabel(k))} (${days[k]})</option>`).join('');
 sel.value=days[cur]?cur:'';
 $('dayBox').hidden=!hist||!!q;
 if(isStock){document.title=(groups.active.length?`(${groups.active.length}) `:'')+'Campus Store · Προσωπικό';return}
 let list=groups[tab];
 if(hist&&sel.value)list=list.filter(o=>dayKey(doneAt(o))===sel.value);
 if(q)list=orders.filter(o=>[o.code,o.name,o.phone].some(v=>String(v||'').toLowerCase().includes(q)));
 const focus=document.activeElement&&document.activeElement.classList.contains('note')?document.activeElement.closest('.t').dataset.id:null;
 let html;
 if(!list.length)html=`<div class="empty">${q?'Δεν βρέθηκε παραγγελία.':tab==='active'?'Καμία παραγγελία σε αναμονή.':tab==='ready'?'Καμία έτοιμη παραγγελία.':tab==='done'?'Καμία παραλαβή τις τελευταίες 30 ημέρες.':'Καμία ακύρωση τις τελευταίες 30 ημέρες.'}</div>`;
 else if(hist&&!q){ // grouped by day, newest first
  const by={};list.forEach(o=>{(by[dayKey(doneAt(o))]=by[dayKey(doneAt(o))]||[]).push(o)});
  html=Object.keys(by).sort().reverse().map(k=>{const l=by[k].sort((a,b)=>doneAt(b)-doneAt(a));
   return `<h2 class="day">${esc(dayLabel(k))}<span>${l.length} ${l.length===1?'παραγγελία':'παραγγελίες'} · ${units(l)} τεμάχια</span></h2>`+l.map(ticket).join('')}).join('');
 }else html=[...list].sort((a,b)=>a.at-b.at).map(ticket).join(''); // oldest first to prepare
 $('grid').innerHTML=html;
 if(focus){const t=$('grid').querySelector(`[data-id="${CSS.escape(focus)}"] .note`);if(t){t.focus();t.selectionStart=t.selectionEnd=t.value.length}}
 const waiting=groups.active.length;document.title=(waiting?`(${waiting}) `:'')+'Campus Store · Προσωπικό';
}

function beep(){if(!$('sound').checked)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.12)})}catch(e){}}

let prevSt={};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('toasts').appendChild(el);setTimeout(()=>el.remove(),12000);el.addEventListener('click',()=>el.remove())}
function onList(list){
 if(seen){const fresh=list.filter(o=>!seen.has(o.id));if(fresh.length){beep();if($('autoprint').checked)setTimeout(()=>printOrders(fresh.filter(o=>o.status==='new')),300)}
  list.forEach(o=>{if(prevSt[o.id]&&prevSt[o.id]!=='cancelled'&&o.status==='cancelled'&&o.cancelledBy==='customer'){toast(`Ο πελάτης ακύρωσε την παραγγελία #${o.code||''} (${o.name||''})`);beep()}})}
 prevSt={};list.forEach(o=>prevSt[o.id]=o.status);
 seen=new Set(list.map(o=>o.id));orders=list;paint();
}

$('stockList').addEventListener('click',async e=>{
 const b=e.target.closest('.seg3 button');if(!b)return;const id=b.closest('.srow').dataset.id,v=b.dataset.v;
 const val=v==='today'?{until:dk(new Date())}:v==='off'?{until:null}:null;
 b.closest('.seg3').querySelectorAll('button').forEach(x=>x.disabled=true);
 try{await API.setStock(id,val)}catch(er){toast(msg(er))}
});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));paint()});
$('q').addEventListener('input',paint);
$('day').addEventListener('change',paint);
$('expAll').addEventListener('click',()=>{allOpen=!allOpen;if(!allOpen)openIds.clear();$('expAll').textContent=allOpen?'Κλείσιμο όλων':'Άνοιγμα όλων';paint()});
$('grid').addEventListener('input',e=>{if(e.target.classList.contains('note'))drafts[e.target.closest('.t').dataset.id]=e.target.value});
/* thermal receipt printing (80 mm or 58 mm roll) */
const paper=()=>$('paper').value;
try{$('paper').value=localStorage.getItem('cs_paper')||'80';$('autoprint').checked=!!localStorage.getItem('cs_autoprint')}catch(e){}
$('paper').addEventListener('change',()=>{try{localStorage.setItem('cs_paper',paper())}catch(e){}});
$('autoprint').addEventListener('change',()=>{try{localStorage.setItem('cs_autoprint',$('autoprint').checked?'1':'')}catch(e){}});
const caps=t=>t.normalize('NFD').replace(/[\u0301\u0308]/g,'').toUpperCase().normalize('NFC'); // Greek capitals without accents
function receipt(o){
 const st=STATUS[o.status]||STATUS.new,total=lines(o).reduce((a,l)=>a+(+l.q||0),0);
 return `<div class="rc" style="--pw:${paper()==='58'?'48mm':'72mm'}">
  <div class="shop">CAMPUS STORE<br><span style="font-weight:400;font-size:10pt">American Farm School</span></div>
  <div class="code">#${esc(o.code||'----')}</div>
  ${pick(o)?`<div class="pk">${esc(caps(pick(o)))}</div>`:'<div class="pk">ΠΑΡΑΛΑΒΗ ΣΗΜΕΡΑ</div>'}
  <div><b>${esc(o.name)}</b></div>
  <div class="row"><span>Τηλ.</span><span>${esc(o.phone)}</span></div>
  <div class="row"><span>Παραγγελία</span><span>${esc(fmtTime(o.at))}</span></div>
  <table>${lines(o).map(l=>`<tr><td>${esc(l.n)}</td><td class="q">× ${esc(l.q)}</td></tr>`).join('')}</table>
  <div class="row"><b>Σύνολο τεμαχίων</b><b>${total}</b></div>
  ${o.notes?`<div class="box"><b>Σχόλιο πελάτη:</b> ${esc(o.notes)}</div>`:''}
  ${o.staffNote?`<div class="box"><b>Σημείωμα:</b> ${esc(o.staffNote)}</div>`:''}
  ${o.status==='cancelled'?'<div class="pk">ΑΚΥΡΩΜΕΝΗ</div>':''}
  <div class="foot">Ετοίμασε: ____________<br>Τυπώθηκε ${esc(new Date().toLocaleString('el-GR',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}))}</div>
  <div class="cut"></div></div>`;
}
function printOrders(list){
 if(!list.length)return;
 $('printArea').innerHTML=`<style>@page{size:${paper()}mm auto;margin:0}</style>`+list.map(receipt).join('');
 window.print();
}
$('grid').addEventListener('click',e=>{const s=e.target.closest('.tsum');if(!s)return;const id=s.closest('.t').dataset.id;
 if(allOpen){allOpen=false;orders.forEach(o=>openIds.add(o.id))}
 openIds.has(id)?openIds.delete(id):openIds.add(id);paint();$('expAll').textContent='Άνοιγμα όλων'});
$('grid').addEventListener('click',e=>{const b=e.target.closest('.b-print');if(!b)return;const o=orders.find(x=>x.id===b.closest('.t').dataset.id);if(o)printOrders([o])});
$('grid').addEventListener('click',async e=>{
 const b=e.target.closest('.acts button');if(!b)return;
 const t=b.closest('.t'),id=t.dataset.id,s=b.dataset.s,ta=t.querySelector('.note'),note=ta?ta.value.trim():'';
 if(s==='cancelled'&&!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Πατήστε ξανά για ακύρωση (το σημείωμα θα το δει ο πελάτης)';setTimeout(()=>{if(b.isConnected){b.classList.remove('arm');b.textContent='Ακύρωση παραγγελίας'}},6000);return}
 if(s==='issue'&&!note){t.querySelector('.err').textContent='Γράψε στο σημείωμα τι λείπει, για να το δει ο πελάτης.';ta&&ta.focus();return}
 t.querySelectorAll('button').forEach(x=>x.disabled=true);
 try{await API.setStatus(id,s,s==='done'?(orders.find(o=>o.id===id)||{}).staffNote||note:s==='new'?'':note);delete drafts[id]}
 catch(er){t.querySelector('.err').textContent=msg(er);t.querySelectorAll('button').forEach(x=>x.disabled=false)}
});
$('sound').addEventListener('change',()=>{try{localStorage.setItem('cs_staff_sound',$('sound').checked?'1':'')}catch(e){};beep()});
try{$('sound').checked=!!localStorage.getItem('cs_staff_sound')}catch(e){}

/* sign-in */
function showLogin(m){$('login').hidden=false;$('board').hidden=true;$('tabs').hidden=true;$('outBtn').hidden=!user||user.anon;$('who').textContent='';if(m!==undefined)$('loginMsg').textContent=m}
function showBoard(){$('login').hidden=true;$('board').hidden=false;$('tabs').hidden=false;$('outBtn').hidden=false;$('who').textContent=user.email||''}
async function clearGuest(){if(user&&user.anon)await API.out()}
$('googleBtn').addEventListener('click',async()=>{$('aErr').textContent='';try{await clearGuest();await API.google()}catch(e){$('aErr').textContent=msg(e)}});
$('modeBtn').addEventListener('click',()=>{signUp=!signUp;$('authBtn').textContent=signUp?'Δημιουργία κωδικού':'Σύνδεση';$('modeBtn').textContent=signUp?'Έχω ήδη κωδικό':'Πρώτη φορά; Δημιουργία κωδικού';$('aErr').textContent=''});
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('aErr').textContent='';
 const em=$('aEmail').value.trim(),pw=$('aPass').value;
 try{await clearGuest();if(signUp){await API.emailUp(em,pw,'');await API.verify();showLogin('Σου στείλαμε email επιβεβαίωσης. Πάτα το λινκ του και μετά ανανέωσε αυτή τη σελίδα.')}else await API.emailIn(em,pw)}
 catch(er){$('aErr').textContent=msg(er)}});
$('outBtn').addEventListener('click',()=>API.out());

(async()=>{
 try{API=await CSBackend.start()}catch(e){API=null}
 if(!API){showLogin('Το Firebase δεν έχει ρυθμιστεί (firebase-config.js).');$('googleBtn').hidden=$('authForm').hidden=$('modeBtn').hidden=true;return}
 if(API.kind==='demo')$('demoBar').hidden=false;
 API.onChange(u=>{
  user=u;if(unwatch){unwatch();unwatch=null}seen=null;orders=[];
  if(!u||u.anon)return showLogin('Μόνο για το προσωπικό του Campus Store.');
  if(API.kind!=='demo'&&!u.verified)return showLogin(`Το ${u.email} δεν έχει επιβεβαιωθεί ακόμα. Πάτα το λινκ στο email επιβεβαίωσης και ανανέωσε τη σελίδα.`);
  showBoard();$('grid').innerHTML='<div class="empty">Φόρτωση…</div>';
  if(unstock)unstock();unstock=API.watchStock(onStock);
  unwatch=API.watchAll(onList,e=>{if(unwatch){unwatch();unwatch=null}showLogin(e&&e.code==='permission-denied'?`Ο λογαριασμός ${u.email} δεν έχει πρόσβαση στις παραγγελίες.`:msg(e))});
 });
 setInterval(()=>{if(!$('board').hidden&&!(document.activeElement&&document.activeElement.classList.contains('note')))paint()},60e3); // refresh "ΝΕΑ" labels
})();
}
</script>
</body>
</html>
